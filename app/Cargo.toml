[package]
name = "airlock-app"
version = "0.1.0"
description = "Airlock's laptop app: lets devices in, cuts them off, and alerts you"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "airlock-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
airlock = { path = "../hub" }
notify-rust = "=4.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# custom-protocol: the window loads the built UI from inside the binary, as
# `cargo tauri build` would arrange, without needing the Tauri CLI.
tauri = { version = "=2.12.1", features = ["tray-icon", "custom-protocol"] }
tauri-plugin-single-instance = "=2.5.2"
tokio = { version = "1.53.3", features = ["time", "io-util", "sync", "macros"] }
pty-process = { version = "0.5.3", features = ["async"] }
