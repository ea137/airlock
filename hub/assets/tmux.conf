# tmux for Airlock's terminals: its own server (tmux -L airlock), so nothing
# here touches a tmux you run yourself. Attach by hand: tmux -L airlock attach

set -g default-terminal "tmux-256color"
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 10
set -g focus-events on

# Swipes on the phone arrive as wheel events: tmux scrolls its history.
set -g mouse on

# Airlock draws the tabs, so tmux's own bar is off.
set -g status off

# Each screen showing a terminal is a client of the same session, so tabs
# switch on all of them at once; the window takes the size of whichever
# screen typed last.
set -g window-size latest
